name: wasm-engine

# Builds the WebAssembly engine (see wasm/README.md), uploads it, and deletes old builds.
# It only does work when the default branch has a commit that is not published yet.

on:
  workflow_dispatch:
    inputs:
      sync:
        description: Merge new upstream commits first
        type: boolean
        default: true
      force:
        description: Build even if this commit is already published
        type: boolean
        default: false
      publish:
        description: Upload the build
        type: boolean
        default: true
  # Every day at 08:17 UTC, the quiet part of upstream's day: most commits land between 13:00 and 03:00 UTC.
  schedule:
    - cron: "17 8 * * *"

permissions: {}

concurrency:
  group: wasm-engine
  cancel-in-progress: false

jobs:
  # The only job that can write to the repository. It does nothing but the merge.
  sync:
    name: Merge upstream
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Merge upstream
        if: github.event_name == 'schedule' || inputs.sync
        run: |
          branch=$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)
          if [ "$GITHUB_REF_NAME" != "$branch" ]; then
            echo "::error::Run this workflow from the default branch ($branch)."
            exit 1
          fi
          upstream=$(gh api "repos/$GITHUB_REPOSITORY" --jq .parent.full_name)

          # Changes under .github/ and a wasm/ folder from upstream are not merged automatically.
          # Workflow files on this branch can reach the upload keys, so a person has to read them first.
          list() { # <repo> <folder>: every file in that folder with its content id
            local tree
            tree=$(gh api "repos/$1/git/trees/$branch" --jq ".tree[] | select(.path == \"$2\") | .sha")
            [ -n "$tree" ] || return 0
            gh api "repos/$1/git/trees/$tree?recursive=1" --jq '.tree[] | select(.type != "tree") | "\(.path) \(.sha)"' | sort
          }
          list "$upstream" .github > theirs.txt
          list "$GITHUB_REPOSITORY" .github > ours.txt
          changed=$(comm -23 theirs.txt ours.txt | cut -d' ' -f1)
          if [ -n "$changed" ] || [ -n "$(list "$upstream" wasm)" ]; then
            echo "::error::Upstream changed files that are not merged automatically. Read that diff first. If it is fine, sync the branch by hand and run this workflow again."
            printf '%s\n' "$changed"
            exit 1
          fi

          if ! gh api -X POST "repos/$GITHUB_REPOSITORY/merge-upstream" -f branch="$branch" --jq .message; then
            echo "::error::Upstream could not be merged automatically. Look at what changed upstream before syncing the branch by hand."
            exit 1
          fi

  plan:
    name: Check for new commits
    needs: sync
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      build: ${{ steps.decide.outputs.build }}
      revision: ${{ steps.decide.outputs.revision }}
      upstream_revision: ${{ steps.decide.outputs.upstream_revision }}
      upstream_date: ${{ steps.decide.outputs.upstream_date }}
    steps:
      - name: Decide whether to build
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
          ENGINE_PUBLIC_BASE: ${{ vars.ENGINE_PUBLIC_BASE }}
        run: |
          branch=$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)
          if [ "$GITHUB_REF_NAME" != "$branch" ]; then
            echo "::error::Run this workflow from the default branch ($branch)."
            exit 1
          fi
          revision=$(gh api "repos/$GITHUB_REPOSITORY/commits/$branch" --jq .sha)
          upstream=$(gh api "repos/$GITHUB_REPOSITORY" --jq .parent.owner.login)
          gh api "repos/$GITHUB_REPOSITORY/compare/$upstream:$branch...$revision" --jq .merge_base_commit > base.json
          upstream_revision=$(jq -r .sha base.json)
          upstream_date=$(jq -r .commit.committer.date base.json)

          commit='^[0-9a-f]{40}$'
          date='^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$'
          if ! [[ $revision =~ $commit && $upstream_revision =~ $commit && $upstream_date =~ $date ]]; then
            echo "::error::Unexpected answer from the GitHub API."
            exit 1
          fi

          published=""
          if [ -n "$ENGINE_PUBLIC_BASE" ]; then
            published=$(curl -fsS --max-time 20 "$ENGINE_PUBLIC_BASE/latest.json" 2>/dev/null | jq -r '.revision // empty' || true)
          fi

          if [ "$FORCE" = "true" ] || [ "$revision" != "$published" ]; then build=true; else build=false; fi

          {
            printf 'upstream_revision=%s\n' "$upstream_revision"
            printf 'upstream_date=%s\n' "$upstream_date"
            printf 'revision=%s\n' "$revision"
            printf 'build=%s\n' "$build"
          } >> "$GITHUB_OUTPUT"

          if [ "$build" = "true" ]; then
            echo "Building \`$revision\`." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Nothing to do: \`$revision\` is already published." >> "$GITHUB_STEP_SUMMARY"
          fi

  # Compiles and runs upstream code, so this job gets no secrets and no write access.
  build:
    name: Build
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.revision }}
          persist-credentials: false

      - name: Build the engine
        env:
          SIMC_REVISION: ${{ needs.plan.outputs.revision }}
          SIMC_SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
          SIMC_UPSTREAM_REVISION: ${{ needs.plan.outputs.upstream_revision }}
          SIMC_UPSTREAM_DATE: ${{ needs.plan.outputs.upstream_date }}
        run: bash wasm/docker-build.sh "$RUNNER_TEMP/engine"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine
          path: ${{ runner.temp }}/engine
          if-no-files-found: error
          retention-days: 7

  # Holds the upload keys. It only copies the built files and never runs them.
  publish:
    name: Upload
    needs: [plan, build]
    if: github.event_name == 'schedule' || inputs.publish
    runs-on: ubuntu-latest
    environment: engine-upload
    permissions:
      contents: read
    steps:
      - name: Check that this is still the newest commit
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ needs.plan.outputs.revision }}
        run: |
          branch=$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/$branch" --jq .sha)
          if [ "$head" != "$REVISION" ]; then
            echo "::error::The default branch has moved on since this build. Run the workflow again."
            exit 1
          fi

      # Only the files the upload needs. Nothing else from the repository is on disk in this job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.revision }}
          sparse-checkout: |
            /wasm/publish.mjs
            /wasm/r2.mjs
            /wasm/worker.js
            /LICENSE
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: engine
          path: ${{ runner.temp }}/engine

      - name: Upload
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_PREFIX: ${{ vars.R2_PREFIX }}
          ENGINE_PUBLIC_BASE: ${{ vars.ENGINE_PUBLIC_BASE }}
          SIMC_REVISION: ${{ needs.plan.outputs.revision }}
          SIMC_UPSTREAM_REVISION: ${{ needs.plan.outputs.upstream_revision }}
          SIMC_UPSTREAM_DATE: ${{ needs.plan.outputs.upstream_date }}
        run: node wasm/publish.mjs "$RUNNER_TEMP/engine"

  # Also holds the upload keys. It deletes old builds from the bucket and runs nothing that was built.
  # It is a job of its own so that a failure here does not look like a failed upload,
  # and so that re-running it from the run's page does not upload again.
  cleanup:
    name: Delete old builds
    needs: [plan, publish]
    runs-on: ubuntu-latest
    environment: engine-upload
    permissions:
      contents: read
    steps:
      # Only the files the cleanup needs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.revision }}
          sparse-checkout: |
            /wasm/cleanup.mjs
            /wasm/r2.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Delete old builds
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_PREFIX: ${{ vars.R2_PREFIX }}
        run: node wasm/cleanup.mjs
